[versions]
agp = "9.2.1"
aboutLibraries = "15.2.0"
coil = "3.6.2"
core = "2.3.0"
kotlin = "2.4.20"
ksp = "2.3.6"
composeMarkdown = "0.5.7"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.3.0"
coroutines = "1.10.2"
koinAndroid = "4.2.2"
koinAndroidxCompose = "4.2.2"
espressoCore = "3.7.0"
lazycolumnscrollbar = "2.2.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
appcompat = "1.8.0"
composeBom = "2026.09.00"
kotlinxSerializationJson = "1.11.0"
okhttp = "5.5.0"
opencc4j = "1.14.0"
reorderable = "3.1.0"
datastorePreferences = "1.2.1"
deviceCompat = "2.6"
documentfile = "1.1.0"
room = "2.8.5"
sqlite = "2.6.2"
work = "2.11.2"
pinyin = "0.4.0"
monitor = "1.8.0"
miuix = "0.9.4"
composeMultiplatform = "1.12.0"

[libraries]
aboutlibraries-compose-core = { module = "com.mikepenz:aboutlibraries-compose-core", version.ref = "aboutLibraries" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
compose-destinations-core = { module = "io.github.raamcosta.compose-destinations:core", version.ref = "core" }
compose-markdown = { module = "com.github.jeziellago:compose-markdown", version.ref = "composeMarkdown" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-destinations-ksp = { module = "io.github.raamcosta.compose-destinations:ksp", version.ref = "core" }
lazycolumnscrollbar = { module = "com.github.nanihadesuka:LazyColumnScrollbar", version.ref = "lazycolumnscrollbar" }
# Miuix desktop (-desktop) artifacts are compiled against Compose Multiplatform 1.12.0 + Kotlin 2.4.20
# (see the 0.9.4 pom), which is why composeMultiplatform is pinned to 1.12.0.
miuix-preference-desktop = { module = "top.yukonga.miuix.kmp:miuix-preference-desktop", version.ref = "miuix" }
miuix-ui-desktop = { module = "top.yukonga.miuix.kmp:miuix-ui-desktop", version.ref = "miuix" }
miuix-icons-desktop = { module = "top.yukonga.miuix.kmp:miuix-icons-desktop", version.ref = "miuix" }
miuix-blur-desktop = { module = "top.yukonga.miuix.kmp:miuix-blur-desktop", version.ref = "miuix" }
# Desktop UI tests (off-screen rendering + semantics assertions). The plugin's `compose.uiTest`
# accessor is deprecated/experimental, so the coordinate is pinned directly.
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }
opencc4j = { module = "com.github.houbb:opencc4j", version.ref = "opencc4j" }
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }
# Android's tinypinyin is an AAR that never reached Maven Central (jcenter-only); the desktop
# build uses houbb's JVM pinyin instead, which wraps pinyin4j and adds phrase segmentation.
pinyin = { module = "com.github.houbb:pinyin", version.ref = "pinyin" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koinAndroid" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koinAndroidxCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }
# JVM/multiplatform DataStore core: no Android Context, file path supplied by the caller.
androidx-datastore-preferences-core = { group = "androidx.datastore", name = "datastore-preferences-core", version.ref = "datastorePreferences" }
devicecompat = { module = "com.github.getActivity:DeviceCompat", version.ref = "deviceCompat" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
# BundledSQLiteDriver: ships SQLite itself, so the desktop app does not depend on a system sqlite
# (version matches what Room 2.8.5's room-runtime-jvm pulls in).
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-monitor = { group = "androidx.test", name = "monitor", version.ref = "monitor" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
aboutLibraries = {id = "com.mikepenz.aboutlibraries.plugin.android", version.ref = "aboutLibraries"}
